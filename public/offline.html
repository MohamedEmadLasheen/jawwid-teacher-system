      .mark {

      .en { font-size: 13px; color: rgba(255,255,255,.6); direction: ltr; }

        margin-top: 8px;
        padding: 10px 28px;
        min-height: 44px;
        border: 0; border-radius: 999px;

        font-size: 15px; font-weight: 700; font-family: inherit;

      }

    <p class="en">You’re offline. The Teacher System needs a connection to load your data.</p>
